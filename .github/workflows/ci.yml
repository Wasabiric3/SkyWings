name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SkyWings.slnx --configuration Release
      # The unit tests are not run here: the simulation tests build a full demo database each and take over an hour on a
      # hosted runner (about 9 minutes locally). Run them locally with: dotnet test SkyWings.slnx --configuration Release
      - name: Publish (self-contained, single file)
        run: dotnet publish WinFormsApp3/SkyWings.csproj -p:PublishProfile=win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWings-win-x64
          path: publish/SkyWings.exe
