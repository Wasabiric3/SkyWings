name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SkyWings.slnx --configuration Release
      - name: Test
        run: dotnet test SkyWings.slnx --configuration Release --no-build
      - name: Publish (self-contained, single file)
        run: dotnet publish WinFormsApp3/SkyWings.csproj -p:PublishProfile=win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWings-win-x64
          path: publish/SkyWings.exe
