name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build SkyWings.slnx --configuration Release
      - name: Test
        run: |
          # The simulation tests build a full demo database each, so a few take minutes on a CI runner: slow is not hung.
          dotnet test SkyWings.slnx --configuration Release --no-build --results-directory TestResults --blame-hang --blame-hang-timeout 15m --blame-hang-dump-type none --logger GitHubActions --logger trx *>&1 | Tee-Object test.log
          exit $LASTEXITCODE
      - name: Summarise tests
        if: always()
        run: |
          $tail = (Get-Content test.log -Tail 25) -join '%0A'
          Write-Host "::notice title=dotnet test log tail::$tail"
          $slow = Get-ChildItem TestResults -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue | ForEach-Object {
            $x = [xml](Get-Content $_.FullName)
            $x.TestRun.Results.UnitTestResult | ForEach-Object { [pscustomobject]@{ Name = $_.testName; Secs = [int][TimeSpan]::Parse($_.duration).TotalSeconds } }
          } | Sort-Object Secs -Descending | Select-Object -First 15
          if ($slow) { Write-Host "::notice title=Slowest tests (seconds)::$(($slow | ForEach-Object { "$($_.Secs)s $($_.Name)" }) -join '%0A')" }
          Get-ChildItem TestResults -Recurse -Filter 'Sequence_*.xml' -ErrorAction SilentlyContinue | ForEach-Object {
            $x = [xml](Get-Content $_.FullName)
            $open = $x.TestSequence.Test | Where-Object { $_.Completed -ne 'True' } | ForEach-Object { $_.Name }
            if ($open) { Write-Host "::error title=Tests that never finished::$($open -join '%0A')" }
          }
      - name: Publish (self-contained, single file)
        run: dotnet publish WinFormsApp3/SkyWings.csproj -p:PublishProfile=win-x64 -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: SkyWings-win-x64
          path: publish/SkyWings.exe
